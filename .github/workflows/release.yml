# Builds the Windows installer and Authenticode-signs both the program and the
# installer through the signserver instance.
#
# The program is signed before CPack puts it into the installer: it asks for
# administrator privileges, so an unsigned executable inside a signed installer
# would still make UAC report an unknown publisher on every start.
#
# Signing itself is an HTTPS call and needs no Windows runner, but splitting it
# into its own job would mean carrying the whole build tree between jobs just to
# repackage, so everything stays in one job here.

name: Release

# A push builds nothing. A tag builds everything, because a release has to be
# complete; anything else is asked for by hand, naming the platforms it needs.
# This was learned the expensive way: Windows minutes cost twice Linux ones,
# and a day of pushing a branch to see what happens eats into the month's
# quota with nothing to show for it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which platforms to build'
        type: choice
        default: all
        options:
          - all
          - windows
          - linux
      release_tag:
        description: 'Existing release tag to rebuild without moving it (for example v1.1.5)'
        type: string
        default: ''
      allow_reported_detections:
        description: 'Publish this manually reviewed scan with its detections disclosed'
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

# A push replaces the one before it: the older run is building code nobody is
# waiting for any more, and it takes runners - the Intel Mac especially - from
# the run that matters.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || inputs.platforms == 'all'
      || inputs.platforms == 'windows'
    runs-on: windows-latest

    # Keep this repository's Windows releases from scanning concurrently.
    concurrency:
      group: ocelot-windows-release
      cancel-in-progress: false

    # to attach the installer to the release of the tag it was built from
    permissions:
      contents: write

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # the version comes from git describe
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || github.ref }}

      - name: Verify the release source
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "Expected an existing vX.Y.Z release tag"
          }
          $tagRef = 'refs/tags/' + $env:RELEASE_TAG
          $releaseCommit = (git rev-parse --verify "$tagRef^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Release tag could not be resolved" }
          $checkoutCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkoutCommit -ne $releaseCommit) {
              throw "Checkout does not match the release tag"
          }
          $project = Get-Content -LiteralPath CMakeLists.txt -Raw
          $version = [regex]::Match($project, 'project\(\s*ocelot\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)')
          if (!$version.Success -or $version.Groups[1].Value -ne $env:RELEASE_TAG.Substring(1)) {
              throw "Application version does not match the release tag"
          }
          "RELEASE_COMMIT=$releaseCommit" >> $env:GITHUB_ENV
          Write-Output "Release source: $env:RELEASE_TAG at $releaseCommit"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            patch
            make
            unzip
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-nsis

      # Without --head the script builds openconnect v9.12, which is API 5.9.
      # The wintun workaround in vpninfo.cpp insists on exactly that version,
      # and master has already moved past it.
      - name: Build the dependencies
        run: ./contrib/build_deps_mingw@msys2.sh

      - name: Select the 64-bit installer target
        run: printf '\nTarget amd64-unicode\n' >> "$MINGW_PREFIX/etc/nsisconf.nsh"

      # openconnect-TAG already defaults to v9.12, which is what the dependency
      # script builds without --head; naming it here too would only be a second
      # place to keep in step with the archives that script leaves in external/
      # actions/checkout writes the files through Git for Windows, which
      # converts them to CRLF, while the version is read by the git inside
      # MSYS2, which does not expect that and reports every text file as
      # modified - enough for `git describe --dirty` to mark the version.
      - name: Read the checkout the same way it was written
        run: git config core.autocrlf true

      - name: Configure
        run: cmake -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -S . -B build

      - name: Build
        run: cmake --build build -j$(nproc)

      # CPack copies the program into a staging tree and only then rewrites it
      # there, with fixup_bundle and windeployqt. Signing the built executable
      # is therefore pointless: the copy that ends up in the installer is
      # written afterwards. Stage first, sign the staged copy, and let NSIS
      # assemble the installer from that tree.
      - name: Stage the installer contents
        run: |
          cd build
          if ! cpack; then
              cat _CPack_Packages/win64/NSIS/NSISOutput.log
              exit 1
          fi

      # The staging directory carries the version in its name, and the signing
      # action expands * in the file name only, so the path is resolved here.
      - name: Locate the staged program
        run: |
          echo "STAGED_EXE=$(ls -d build/_CPack_Packages/win64/NSIS/*/App/ocelot.exe)" >> "$GITHUB_ENV"
          echo "NSIS_DIR=build/_CPack_Packages/win64/NSIS" >> "$GITHUB_ENV"

      # Sign verified release tags, including explicit manual rebuilds. Ordinary
      # branch packaging checks do not use the signing service.
      - name: Sign the staged program
        if: env.RELEASE_TAG != ''
        uses: sculkdev/sign-with-signserver@v1
        with:
          url: ${{ secrets.SIGNSERVER_URL }}
          sub: ${{ secrets.SIGNSERVER_SUB }}
          secret: ${{ secrets.SIGNSERVER_SECRET }}
          path: ${{ env.STAGED_EXE }}
          output-dir: ${{ runner.temp }}/ocelot-signed-program
          require-timestamp: true
          fail-on-warning: true

      # A reset upload can leave the action holding its input open on Windows.
      # Sign into a separate directory, then replace it after that process exits.
      - name: Restore the signed staged program
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/ocelot-signed-program/ocelot.exe" -Destination $env:STAGED_EXE -Force

      # makensis rather than cpack: cpack would run its install step again and
      # overwrite the signature in the staging tree. NSIS only reads what is
      # already there, and writes the installer next to the script.
      - name: Assemble the installer from the signed staging tree
        run: makensis "$NSIS_DIR/project.nsi"

      - name: Sign the installer
        id: sign-installer
        if: env.RELEASE_TAG != ''
        uses: sculkdev/sign-with-signserver@v1
        with:
          url: ${{ secrets.SIGNSERVER_URL }}
          sub: ${{ secrets.SIGNSERVER_SUB }}
          secret: ${{ secrets.SIGNSERVER_SECRET }}
          path: ${{ env.NSIS_DIR }}/*-win64.exe
          output-dir: ${{ runner.temp }}/ocelot-signed-installer
          require-timestamp: true
          fail-on-warning: true

      - name: Restore the signed installer
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem "$env:RUNNER_TEMP/ocelot-signed-installer/*-win64.exe")
          if ($signed.Count -ne 1) { throw "Expected one signed installer" }
          Copy-Item -LiteralPath $signed[0].FullName -Destination (Join-Path $env:NSIS_DIR $signed[0].Name) -Force

      - name: Refresh the checksum of the signed installer
        run: |
          cd "$NSIS_DIR"
          for f in *-win64.exe; do
              sha512sum "$f" > "$f.sha512"
          done

      # The same staged tree the installer is built from, as one folder anyone can
      # unpack and run: such a copy keeps its settings beside itself and can
      # install itself later from its own settings screen. The console
      # openconnect is left out, as it is in a default install.
      - name: Assemble the portable archive
        run: |
          staged=$(ls -d "$NSIS_DIR"/*/ | head -1)
          installer=$(ls "$NSIS_DIR"/*-win64.exe | head -1)
          name="$(basename "$installer" .exe)-portable.zip"

          rm -rf portable
          mkdir -p portable/Ocelot
          cp -a "${staged}App/." portable/Ocelot/
          cp -a "${staged}vpnc_script/." portable/Ocelot/
          (cd portable && zip -qr "../$name" Ocelot)
          sha512sum "$name" > "$name.sha512"
          echo "PORTABLE_ZIP=$name" >> "$GITHUB_ENV"
          ls -l "$name"

      - name: Verify the signed Windows packages
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem "$env:NSIS_DIR/*-win64.exe")
          if ($installer.Count -ne 1) { throw "Expected one installer" }
          $portableRoot = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          Expand-Archive -LiteralPath $env:PORTABLE_ZIP -DestinationPath $portableRoot
          $portableExe = Join-Path $portableRoot "Ocelot/ocelot.exe"
          foreach ($file in @($installer[0].FullName, $portableExe)) {
              $signature = Get-AuthenticodeSignature -LiteralPath $file
              if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate) {
                  throw "Invalid or untimestamped signature: $file"
              }
              Write-Output "Authenticode verified: $([IO.Path]::GetFileName($file))"
          }
          foreach ($file in @($installer[0].FullName, $env:PORTABLE_ZIP)) {
              $expected = ((Get-Content -LiteralPath "$file.sha512" -Raw).Trim() -split '\s+')[0]
              if ((Get-FileHash -LiteralPath $file -Algorithm SHA512).Hash -ne $expected) {
                  throw "Checksum mismatch: $file"
              }
              $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
              Write-Output "SHA256 $([IO.Path]::GetFileName($file)) $hash"
          }
          foreach ($pair in @(
              @('contrib/ocelot-dns.ps1', 'Ocelot/ocelot-dns.ps1'),
              @('contrib/vpnc-script-win.js', 'Ocelot/vpnc-script.js'))) {
              if ((Get-FileHash -LiteralPath $pair[0]).Hash -ne
                  (Get-FileHash -LiteralPath (Join-Path $portableRoot $pair[1])).Hash) {
                  throw "Portable DNS script differs from its source: $($pair[1])"
              }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            build/_CPack_Packages/win64/NSIS/*-win64.exe
            build/_CPack_Packages/win64/NSIS/*-win64.exe.sha512

      - uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          if-no-files-found: error
          path: |
            ${{ env.PORTABLE_ZIP }}
            ${{ env.PORTABLE_ZIP }}.sha512

      - name: Scan the signed Windows installer
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          ALLOW_VT_DETECTIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_reported_detections && 'true' || 'false' }}
        run: |
          $installer = @(Get-ChildItem "$env:NSIS_DIR/*-win64.exe")
          if ($installer.Count -ne 1) { throw "Expected one signed installer" }
          node contrib/virustotal.cjs $installer[0].FullName --output virustotal-report.json
          if ($LASTEXITCODE -ne 0) { throw "VirusTotal analysis was not completed" }
          $report = Get-Content -LiteralPath virustotal-report.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'completed' -or !$report.stats) {
              throw "VirusTotal report is incomplete"
          }
          $checkedEngines = 0
          foreach ($category in @('malicious', 'suspicious', 'undetected', 'harmless')) {
              $value = $report.stats.$category
              if (($value -isnot [int] -and $value -isnot [long]) -or $value -lt 0) {
                  throw "VirusTotal report contains invalid detection counts"
              }
              $checkedEngines += $value
          }
          if ($checkedEngines -le 0) { throw "VirusTotal report contains no verdicts" }
          if ($report.stats.malicious -gt 0 -or $report.stats.suspicious -gt 0) {
              if ($env:ALLOW_VT_DETECTIONS -ne 'true') {
                  throw "VirusTotal detections require an explicitly reviewed manual release"
              }
              Write-Output "::warning::VirusTotal reports $($report.stats.malicious) malicious and $($report.stats.suspicious) suspicious verdicts. Reviewed manual publication: $($report.reportUrl)"
          }

      - name: Preserve the VirusTotal report
        if: always() && env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v7
        with:
          name: windows-virustotal-report
          path: virustotal-report.json
          if-no-files-found: warn

      # Artifacts of a run expire; a release keeps the installer at a stable
      # address. Manual rebuilds attach to the same verified release tag.
      # Run in pwsh: the MSYS2 shell does not carry the Windows PATH, so gh
      # would not be found there.
      - name: Publish the installer and the portable archive on the release page
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same shape as the other three jobs: create the release if this
          # one got here first, then add to it. No job waits for another, and
          # none of them assumes a release already exists.
          $files = @(Get-ChildItem "$env:NSIS_DIR/*-win64.exe", "$env:NSIS_DIR/*-win64.exe.sha512", "$env:PORTABLE_ZIP", "$env:PORTABLE_ZIP.sha512" | ForEach-Object { $_.FullName })
          gh release view $env:RELEASE_TAG 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
              gh release create $env:RELEASE_TAG --verify-tag --title $env:RELEASE_TAG --notes "Built from $env:RELEASE_COMMIT."
              if ($LASTEXITCODE -ne 0) {
                  gh release view $env:RELEASE_TAG 2>$null | Out-Null
                  if ($LASTEXITCODE -ne 0) { throw "Release could not be created or found" }
              }
          }
          gh release upload $env:RELEASE_TAG $files --clobber
          if ($LASTEXITCODE -ne 0) { throw "Windows release upload failed" }
          $scan = Get-Content -LiteralPath virustotal-report.json -Raw | ConvertFrom-Json
          $body = (gh release view $env:RELEASE_TAG --json body --jq '.body') -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "Release notes could not be read" }
          $startMarker = '<!-- virustotal-report:start -->'
          $endMarker = '<!-- virustotal-report:end -->'
          $summary = "### VirusTotal`n`n[Windows installer]($($scan.reportUrl)).`n`nMalicious: $($scan.stats.malicious); suspicious: $($scan.stats.suspicious); undetected: $($scan.stats.undetected); harmless: $($scan.stats.harmless). Analysis: $($scan.analysisDate)."
          if ($scan.stats.malicious -gt 0 -or $scan.stats.suspicious -gt 0) {
              $summary += "`n`nWarning: this report contains detections; they have not been confirmed as false positives."
          }
          $section = "$startMarker`n$summary`n$endMarker"
          $pattern = '(?s)' + [regex]::Escape($startMarker) + '.*?' + [regex]::Escape($endMarker)
          if ([regex]::IsMatch($body, $pattern)) {
              $notes = [regex]::Replace($body, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($match) $section })
          } else {
              $notes = "$body`n`n$section`n"
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'ocelot-release-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          gh release edit $env:RELEASE_TAG --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw "VirusTotal release results could not be saved" }

  # Fedora rather than the Ubuntu runner: the program needs Qt 6.5 for
  # Application.styleHints.colorScheme, and Ubuntu 24.04 still carries 6.4.
  linux:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || inputs.platforms == 'all'
      || inputs.platforms == 'linux'
    runs-on: ubuntu-latest
    container: fedora:41

    # to attach the app image to the release of the tag it was built from - and
    # to create that release, since this job can finish first
    permissions:
      contents: write

    steps:
      # Deliberately without spdlog-devel: the project falls back to building
      # and statically linking its own copy when the system one is missing,
      # which is what the Windows build already does. With the system
      # package installed, the published executable asks for libspdlog.so at
      # startup and stops before showing anything on a machine without it.
      - name: Install the dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
              gcc-c++ cmake git patch pkgconf-pkg-config \
              qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qttools-devel \
              openconnect-devel gnutls-devel libxml2-devel \
              file wget findutils fuse-libs \
              qt6-qtdeclarative qt6-qtbase-gui

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # the version comes from git describe
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || github.ref }}

      - name: Allow git to read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify the release source
        if: env.RELEASE_TAG != ''
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          release_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$release_commit"
          version=$(sed -nE '/^project\(ocelot/,/^\)/s/^[[:space:]]*VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt)
          test "$version" = "${RELEASE_TAG#v}"
          echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"
          printf 'Release source: %s at %s\n' "$RELEASE_TAG" "$release_commit"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      # An AppImage is built from an installed tree, not from the build
      # directory: the desktop entry, the icon and the metadata only exist
      # after the install step.
      - name: Install into a staging tree
        run: |
          cmake --install build --prefix "$PWD/AppDir/usr"
          test -x AppDir/usr/bin/ocelot
          test -f AppDir/usr/share/applications/ocelot.desktop
          test -f AppDir/usr/share/icons/hicolor/256x256/apps/ocelot.png
          find AppDir -type f | sort

      # linuxdeploy copies in the libraries the program and its Qt plugins
      # need, so the result runs on distributions older than the one it was
      # built on. It needs FUSE to run as an AppImage itself, which a container
      # does not have; --appimage-extract-and-run unpacks it instead.
      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QMAKE: /usr/bin/qmake6
          OUTPUT: ocelot-x86_64.AppImage
          # The strip inside linuxdeploy is older than the compiler here and
          # rejects every library Fedora builds: "unknown type [0x13] section
          # .relr.dyn". Stripping only makes the result smaller, so it is
          # dropped rather than worked around.
          NO_STRIP: "true"
          # The QML of this program is compiled into the executable as a Qt
          # resource, so the plugin has nothing to scan and deploys none of
          # Qt's own QML modules - the libraries end up bundled but QtQuick
          # itself does not, and the program stops at "module QtQuick is not
          # installed". Pointing it at the sources is what lets it find them.
          QML_SOURCES_PATHS: ${{ github.workspace }}/src/qml
        run: |
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          qtbase=https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous
          wget -q "$base/linuxdeploy-x86_64.AppImage"
          wget -q "$qtbase/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
              --appdir AppDir \
              --plugin qt \
              --output appimage
          ls -l ./*.AppImage

      - name: Checksum the AppImage
        run: sha512sum ocelot-x86_64.AppImage > ocelot-x86_64.AppImage.sha512

      - name: Verify AppImage startup
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QT_QPA_PLATFORM: offscreen
          QT_QPA_PLATFORM_PLUGIN_PATH: /usr/lib64/qt6/plugins/platforms
          QT_QUICK_BACKEND: software
        run: |
          smoke_root=$(mktemp -d)
          export XDG_CONFIG_HOME="$smoke_root/config"
          export XDG_CACHE_HOME="$smoke_root/cache"
          export XDG_RUNTIME_DIR="$smoke_root/runtime"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          ./ocelot-x86_64.AppImage --version
          result=0
          timeout 5 ./ocelot-x86_64.AppImage || result=$?
          test "$result" -eq 124

      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: |
            ocelot-x86_64.AppImage
            ocelot-x86_64.AppImage.sha512

      # Artifacts expire with the run; a release keeps the file at an address
      # that can be handed to someone. Only for tags - a branch run has no
      # release to attach anything to.
      - name: Publish the app image on the release page
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dnf -y install --setopt=install_weak_deps=False gh
          # Whichever job finishes first creates the release; the others add to
          # it. Uploading into a release that does not exist yet is what broke
          # the first run of this: only the Windows job created one, and it is
          # the slowest of the four.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              if ! gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
                  --notes "Built from $RELEASE_COMMIT."; then
                  gh release view "$RELEASE_TAG" >/dev/null
              fi
          fi
          gh release upload "$RELEASE_TAG" \
              ocelot-x86_64.AppImage \
              ocelot-x86_64.AppImage.sha512 --clobber
