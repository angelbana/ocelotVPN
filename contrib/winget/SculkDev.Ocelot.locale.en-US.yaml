ShortDescription: A VPN client for servers that speak the Cisco AnyConnect protocol, built on OpenConnect.
Description: |-
  Ocelot connects to VPN servers that speak the Cisco AnyConnect protocol. It remembers
  the password for a profile, can dial on its own when the program starts, when you sign
  in to Windows and again after a connection drops, and lives in the notification area.
  Unpacked into a folder of its own it runs as a portable copy and keeps its settings
  beside it; installed, it behaves like any other installed program.
